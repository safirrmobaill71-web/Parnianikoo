<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ساعت و انگیزشی روزانه</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <!-- بخش ساعت دیجیتال -->
        <div class="clock-box">
            <h2 id="clock">00:00:00</h2>
            <p id="date">تاریخ امروز</p>
        </div>

        <!-- بخش باکس انگیزشی -->
        <div class="quote-box">
            <p id="quote">"امروز یک روز فوق‌العاده برای شروع است..."</p>
            <button id="newQuoteBtn">جمله جدید</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
